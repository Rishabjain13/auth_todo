<!DOCTYPE html>
<html lang="en">
<head>
    <title>ToDoApp</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app">

    <aside class="sidebar">
        <div class="user">
            <img src="/static/user.avif" alt="User Image" class="image">
            <h2 id="username">Loading...</h2>
            <p id="useremail">Loading...</p>
            <button class="logout" onclick="logout()">Logout</button>
        </div>

        <nav>
            <a href="#">Dashboard</a>
            <a href="#">My Tasks</a>
            <a href="#">Calendar</a>
            <a href="#">Completed</a>
            <a href="#">Settings</a>
        </nav>
    </aside>

    <main class="content">

        <header class="top">
            <div>
                <h1>TodoApp</h1>
                <p id="todayDate"></p>
            </div>

            <div class="header-actions">
                <input id="taskInput" type="text" placeholder="Task title">

                <select id="prioritySelect">
                    <option>High</option>
                    <option selected>Medium</option>
                    <option>Low</option>
                </select>

                <!-- ✅ ADD: onclick -->
                <button class="add" onclick="addTask()">+ Add Task</button>
            </div>
        </header>

        <!-- ================= STATS (NO REMOVAL) ================= -->
        <section class="stats">
            <div class="green">Task Done <span id="doneCount">0</span></div>
            <div class="orange">Pending <span id="pendingCount">0</span></div>
            <div class="red">Overdue <span id="overdueCount">0</span></div>
        </section>

        <!-- ================= PENDING TASKS ================= -->
        <section class="tasks">
            <h2>My Tasks</h2>

            <!-- ✅ Tasks injected by JS here -->
            <div id="todayTasks"></div>
        </section>

        <!-- ================= COMPLETED TASKS ================= -->
        <section class="taskcompleted">
            <h2>Completed</h2>

            <!-- ✅ Completed tasks injected by JS here -->
            <div id="completedTasks"></div>
        </section>

    </main>
</div>

<script src="/static/script.js"></script>
</body>
</html>
